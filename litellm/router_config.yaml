model_list:
  # ----------------------------------------------------
  # GENERATION (Text completion)
  # ----------------------------------------------------
  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "openai/mistral-large"
      api_base: "https://router.bynara.id/v1"
      api_key: "os.environ/NARA_API_KEY"

  # ----------------------------------------------------
  # EMBEDDINGS
  # ----------------------------------------------------
  # The IDE Gemini key only supports gemini-embedding-2.
  - model_name: "text-embedding-3-small"
    litellm_params:
      model: "gemini/gemini-embedding-2"
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 90

litellm_settings:
  drop_params: true
